name: EAS OTA Update

on:
  push:
    branches: [main]

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: eas update --branch main --message "Auto update from ${{ github.sha }}" --non-interactive

      - name: Notify on success
        if: success()
        run: echo "✅ OTA update published to branch main"

      - name: Notify on failure
        if: failure()
        run: echo "❌ OTA update failed"
